name: Build or publish PyPI release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version expected in pyproject.toml
        required: true
        type: string
      publish:
        description: Upload to PyPI using Trusted Publishing
        type: boolean
        default: false

permissions: {}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, tomllib
          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          if version != os.environ["EXPECTED_VERSION"]:
              raise SystemExit(f"Expected the selected release version, found {version}")
          PY
      - run: python -m pip install build twine
      - run: python -m unittest discover -s tests
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jax-diagnostics/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
